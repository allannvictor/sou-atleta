name: Deploy

# Publica o site na Cloudflare quando algo entra na main. A main só recebe PR com o CI verde
# (ruleset do repositório), então o que chega aqui já passou pelas checagens.
# Não roda em PR nem em fork: só em push na main, e os secrets nunca são impressos.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Um deploy por vez; um deploy em andamento termina antes de o próximo começar.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e deploy na Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Os secrets só entram nos dois passos que precisam deles (conferir e fazer o deploy).
      # Passos que rodam código de terceiros, como a instalação das dependências, não os veem.
      - name: Conferir se os secrets da Cloudflare existem
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          faltando=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || faltando="$faltando CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || faltando="$faltando CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$faltando" ]; then
            echo "pronto=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy pulado::Faltam os secrets do GitHub:$faltando. Cadastre em Settings > Secrets and variables > Actions. O passo a passo está no PR da issue #4."
            {
              echo "### Deploy pulado"
              echo
              echo "Faltam os secrets do GitHub:$faltando"
              echo
              echo "Cadastre em **Settings > Secrets and variables > Actions** e rode este workflow de novo."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.pronto == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.pronto == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.pronto == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.secrets.outputs.pronto == 'true'
      - name: Build
        if: steps.secrets.outputs.pronto == 'true'
        run: pnpm --filter @sou-atleta/web build
      - name: Deploy (wrangler)
        if: steps.secrets.outputs.pronto == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm --filter @sou-atleta/web exec wrangler deploy
